<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>복싱 라운드 타이머</title>
<style>
:root{--bg:#fff;--fg:#000;--dis:color-mix(in srgb,var(--fg) 30%,var(--bg));--rc:#c43830;--rt:#fff;--sc:#1d4e89;--st:#fff;--pc:#fff;--pt:#000;--wc:#f2a900;--wt:#000;--done:#2a7a4b;color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow-x:hidden}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--fg);font-family:"Barlow Condensed","Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;transition:background .25s,color .25s}
body.round{background:var(--rc);color:var(--rt)}
body.rest{background:var(--sc);color:var(--st)}
body.prep{background:var(--pc);color:var(--pt)}
body.warn{background:var(--wc);color:var(--wt)}
body.done{background:var(--done);color:#fff}
.wrap{max-width:480px;margin:0 auto;height:100%;display:flex;flex-direction:column;padding:20px}
.top{display:grid;grid-template-columns:44px 1fr 44px;align-items:center;gap:8px;margin:4px 0 18px}
.top h1{text-align:center}
.sp{visibility:hidden}
.name{justify-self:center;max-width:100%;min-width:0;display:flex;align-items:center;gap:8px;font:inherit;font-size:26px;font-weight:700;background:transparent;color:var(--fg);border:0;padding:8px 10px;cursor:pointer}
.name span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.caret{border:6px solid transparent;border-top-color:currentColor;border-bottom:0;flex:none}
.prow{gap:10px}
.pick{font:inherit;width:100%;text-align:left;cursor:pointer;flex-direction:column;align-items:flex-start;gap:2px;margin-bottom:8px!important}
.pick span{font-size:22px!important}
.pick small{font-size:16px;opacity:.7}
.pick[aria-pressed=true]{background:var(--fg);color:var(--bg)}
.chip:disabled{opacity:.35;cursor:default}
.tin{flex:1;min-width:0;font:inherit;font-size:20px;font-weight:600;background:transparent;color:var(--fg);border:0;outline:0;padding:6px 0}
.prof{margin-bottom:6px}
h1{font-size:26px;margin:0;font-weight:700}
.icon{width:44px;height:44px;border-radius:50%;border:2px solid var(--fg);background:transparent;color:var(--fg);display:flex;align-items:center;justify-content:center;padding:0;cursor:pointer}
.settings{display:flex;flex-direction:column;gap:10px}
.row{display:flex;align-items:center;justify-content:space-between;background:var(--bg);border:2px solid var(--fg);border-radius:14px;padding:12px 14px;color:var(--fg)}
.row span{font-size:20px;font-weight:600}
.step{display:flex;align-items:center;gap:12px}
.step b{font-size:30px;min-width:76px;text-align:center;font-variant-numeric:tabular-nums}
.step button{width:44px;height:44px;border-radius:50%;border:2px solid var(--fg);background:transparent;color:var(--fg);font-size:24px;font-weight:700}
.step button:disabled{color:var(--dis);border-color:var(--dis);cursor:default}
button:focus-visible{outline:3px solid var(--fg);outline-offset:2px}
.total{margin:14px 2px 0;font-size:18px;opacity:.7}
.btn{border:0;border-radius:16px;font:inherit;font-weight:700;font-size:26px;padding:16px;cursor:pointer}
.go{background:var(--fg);color:var(--bg);margin-top:auto}
.clock{display:none;flex:1;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:6px}
.phase{font-size:44px;font-weight:700;letter-spacing:.02em}
.time{font-size:min(36vw,170px);font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.count{font-size:26px;opacity:.85}
.left{font-size:22px;opacity:.75;font-variant-numeric:tabular-nums}
.bar{width:100%;height:10px;border-radius:5px;background:color-mix(in srgb,currentColor 22%,transparent);overflow:hidden;margin-top:18px}
.bar i{display:block;height:100%;width:0;background:currentColor;opacity:.85}
.ctrl{display:none;gap:10px}
.ctrl .btn{flex:1;background:color-mix(in srgb,currentColor 20%,transparent);color:inherit;font-size:22px}
.running .top,.running .settings,.running .total,.running .go{display:none}
.running .clock{display:flex}.running .ctrl{display:flex}
.nav{display:none;gap:10px;margin-top:10px}
.running .nav{display:flex}
.nav .btn{flex:1;font-size:16.5px;padding:12px;border-radius:12px;background:color-mix(in srgb,currentColor 20%,transparent);color:inherit}
.nav .btn:disabled{opacity:.3;cursor:default}
.colorin{width:64px;height:44px;border:2px solid var(--fg);border-radius:12px;padding:0;background:transparent;cursor:pointer}
/* settings panel */
.panel{display:none;position:fixed;inset:0;z-index:5;background:var(--bg);color:var(--fg);overflow-x:hidden;overflow-y:auto;overscroll-behavior-x:none;touch-action:pan-y;padding:calc(env(safe-area-inset-top,0px) + 20px) 20px calc(env(safe-area-inset-bottom,0px) + 32px)}
.panel.open{display:block}
.pin{max-width:480px;width:100%;margin:0 auto}
.panel h2{font-size:22px;margin:26px 0 10px}
.panel .hint{font-size:16px;opacity:.65;margin:0 0 8px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.chip{position:relative;font:inherit;font-size:18px;font-weight:600;padding:9px 14px;border-radius:999px;border:2px solid var(--fg);background:transparent;color:var(--fg);cursor:pointer}
.chip[aria-pressed=true]{background:var(--fg);color:var(--bg)}
.chip{overflow:hidden}
.chip input{position:absolute;left:0;top:0;width:1px;height:1px;opacity:0;pointer-events:none}
.sw{width:64px;height:44px;border-radius:12px;border:2px solid #888;font:inherit;font-size:20px;font-weight:700;cursor:pointer}
.panel .row{margin-bottom:10px}
input[type=range]{width:55%;min-width:0;max-width:100%;accent-color:var(--fg)}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 24px);transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:18px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:9}
.toast.on{opacity:1}
.reset{width:100%;margin-top:16px;background:transparent;color:var(--fg);border:2px solid var(--fg);font-size:20px}
@media (prefers-reduced-motion:reduce){body,.toast{transition:none}}
</style>
</head>
<body>
<div class="wrap" id="app">
  <div class="top">
    <button class="icon" id="gear" aria-label="설정"><svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></button>
    <button class="name" id="pname" aria-label="운동 선택"><i class="caret"></i><span id="pn"></span></button>
    <span class="icon sp" aria-hidden="true"></span>
  </div>
  <div class="settings" id="settings"></div>
  <div class="total" id="total"></div>
  <button class="btn go" id="start">시작</button>
  <div class="clock">
    <div class="phase" id="phase"></div>
    <div class="time" id="time">0:00</div>
    <div class="count" id="count"></div>
    <div class="left" id="left"></div>
    <div class="bar"><i id="fill"></i></div>
  </div>
  <div class="ctrl">
    <button class="btn" id="pause">일시정지</button>
    <button class="btn" id="stop">종료</button>
  </div>
  <div class="nav">
    <button class="btn" id="prev">이전으로</button>
    <button class="btn" id="next">건너뛰기</button>
  </div>
</div>
<div class="panel" id="panel" aria-label="설정"></div>
<div class="panel" id="ppanel" aria-label="운동 목록"></div>
<div class="toast" id="toast" role="status"></div>

const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const DEF={round:180,rest:60,rounds:3,prep:10,warn:10,startSnd:'a',endSnd:'bell',startName:'',endName:'',vol:100,vib:true,mainBg:'#ffffff',mainFg:'#000000',cRound:'#c43830',cRest:'#1d4e89',cPrep:'#ffffff',cWarn:'#f2a900'};
const LOOK=['startSnd','endSnd','startName','endName','vol','vib','mainBg','mainFg','cRound','cRest','cPrep','cWarn'];
const TKEYS=['round','rest','rounds','prep','warn'];
const TDEF={round:180,rest:60,rounds:3,prep:10,warn:10};
const pick=o=>TKEYS.reduce((a,k)=>(a[k]=o[k],a),{});
let cfg=Object.assign({},DEF);
try{const s=JSON.parse(localStorage.getItem('boxtimer')||'null');if(s){if(s.color&&!s.cRound)s.cRound=s.color;delete s.color;Object.assign(cfg,s);if(cfg.startSnd==='b')cfg.startSnd='a'}}catch(e){}
if(!Array.isArray(cfg.profiles)||!cfg.profiles.length){cfg.profiles=[Object.assign({id:'p1',name:'복싱'},pick(cfg))];cfg.cur='p1'}
if(!cfg.profiles.some(p=>p.id===cfg.cur))cfg.cur=cfg.profiles[0].id;
function curProf(){return cfg.profiles.find(p=>p.id===cfg.cur)}
function loadProf(){Object.assign(cfg,pick(curProf()))}
function updName(){$('pn').textContent=curProf().name}
loadProf();
function save(){try{localStorage.setItem('boxtimer',JSON.stringify(cfg))}catch(e){}}
const FIELDS=[
  {k:'round',label:'라운드 시간',step:15,min:15,max:600,fmt:s=>fmt(s)},
  {k:'rest',label:'휴식 시간',step:5,min:5,max:180,fmt:s=>fmt(s)},
  {k:'rounds',label:'라운드 수',step:1,min:1,max:20,fmt:n=>n+'R'},
  {k:'prep',label:'준비 시간',list:[0,3,5,10,15,20,25,30],fmt:s=>s+'초'},
  {k:'warn',label:'종료 임박 알림',step:5,min:0,max:30,fmt:s=>s?s+'초 전':'끔'}
];
function fmt(s){return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}

/* ---- colors ---- */
const okc=(c,d)=>/^#[0-9a-f]{6}$/i.test(c)?c:d;
function ink(c){const n=parseInt(c.slice(1),16);return((0.299*(n>>16)+0.587*((n>>8)&255)+0.114*(n&255))/255)>0.6?'#000':'#fff'}
function applyColors(){
  const st=document.documentElement.style;
  st.setProperty('--bg',okc(cfg.mainBg,DEF.mainBg));st.setProperty('--fg',okc(cfg.mainFg,DEF.mainFg));
  [['r','cRound'],['s','cRest'],['p','cPrep'],['w','cWarn']].forEach(([k,n])=>{
    const c=okc(cfg[n],DEF[n]);st.setProperty('--'+k+'c',c);st.setProperty('--'+k+'t',ink(c));
  });
}

/* ---- main settings ---- */
function bounds(f){
  if(f.list){const i=f.list.indexOf(cfg[f.k]);return[i<=0,i>=f.list.length-1]}
  return[cfg[f.k]<=f.min,cfg[f.k]>=f.max];
}
function change(f,d){
  if(f.list){
    let i=f.list.indexOf(cfg[f.k]);if(i<0)i=f.list.findIndex(v=>v>=cfg[f.k]);if(i<0)i=f.list.length-1;
    cfg[f.k]=f.list[Math.min(f.list.length-1,Math.max(0,i+d))];
  }else cfg[f.k]=Math.min(f.max,Math.max(f.min,cfg[f.k]+d*f.step));
  Object.assign(curProf(),pick(cfg));save();renderSettings();
}
function renderSettings(){
  const el=$('settings');el.innerHTML='';
  FIELDS.forEach(f=>{
    const row=document.createElement('div');row.className='row';
    row.innerHTML='<span>'+f.label+'</span><div class="step"><button aria-label="'+f.label+' 줄이기">−</button><b>'+f.fmt(cfg[f.k])+'</b><button aria-label="'+f.label+' 늘리기">+</button></div>';
    const [m,p]=row.querySelectorAll('button');
    const bd=bounds(f);m.disabled=bd[0];p.disabled=bd[1];
    m.onclick=()=>change(f,-1);p.onclick=()=>change(f,1);
    el.appendChild(row);
  });
  $('total').textContent='총 '+fmt(cfg.prep+cfg.round*cfg.rounds+cfg.rest*(cfg.rounds-1))+' 소요';
}

/* ---- sound ---- */
let ac=null,master=null,cur=null;
const bufs={a:null,start:null,end:null};
function audio(){
  if(!ac){try{ac=new (window.AudioContext||window.webkitAudioContext)();master=ac.createGain();master.connect(ac.destination)}catch(e){}}
  if(ac){master.gain.value=cfg.vol/100;if(ac.state==='suspended')ac.resume()}
  return ac;
}
function tone(freq,dur,type,vol,delay){
  const a=audio();if(!a)return;
  const t=a.currentTime+(delay||0),o=a.createOscillator(),g=a.createGain();
  o.type=type||'sine';o.frequency.value=freq;
  g.gain.setValueAtTime(vol||.4,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);
  o.connect(g);g.connect(master);o.start(t);o.stop(t+dur+.02);
}
function bell(n){const gap=n>1?.28:.45,d=n>1?.4:1.1;for(let i=0;i<n;i++){tone(880,d,'sine',.5,i*gap);tone(1760,d*.7,'sine',.25,i*gap);tone(2640,d*.4,'sine',.12,i*gap)}}
function clap(){tone(1500,.07,'square',.3,0);tone(1500,.07,'square',.3,.16)}
function tick(){tone(1000,.08,'square',.2,0)}
function vib(p){if(!cfg.vib)return;try{navigator.vibrate&&navigator.vibrate(p)}catch(e){}}
function dec(ab){const a=audio();return new Promise((res,rej)=>{if(!a)return rej();const p=a.decodeAudioData(ab,res,rej);if(p&&p.catch)p.catch(rej)})}
function b64ab(b){const bin=atob(b),u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return u.buffer}
async function loadPresets(){
  if(!bufs.a)try{bufs.a=await dec(b64ab(A_B64))}catch(e){}
}
function idb(){return new Promise((res,rej)=>{try{const r=indexedDB.open('boxtimer',1);r.onupgradeneeded=()=>r.result.createObjectStore('s');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}catch(e){rej(e)}})}
async function idbPut(k,v){const d=await idb();return new Promise((res,rej)=>{const t=d.transaction('s','readwrite');t.objectStore('s').put(v,k);t.oncomplete=res;t.onerror=()=>rej(t.error)})}
async function idbGet(k){const d=await idb();return new Promise((res,rej)=>{const q=d.transaction('s').objectStore('s').get(k);q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)})}
async function loadCustom(){for(const k of['start','end']){try{const ab=await idbGet(k);if(ab)bufs[k]=await dec(ab.slice(0))}catch(e){}}}
function stopSnd(){try{cur&&cur.stop()}catch(e){}cur=null}
function playBuf(b){const a=audio();if(!a||!b)return false;stopSnd();const s=a.createBufferSource();s.buffer=b;s.connect(master);s.start();cur=s;return true}
function playStart(){const id=cfg.startSnd;if(id==='bell'){bell(1);return}if(!playBuf(id==='custom'?bufs.start:bufs[id]))bell(1)}
function playEnd(){if(cfg.endSnd==='off')return;stopSnd();if(cfg.endSnd==='custom'&&playBuf(bufs.end))return;bell(3)}
function preview(slot){audio();slot==='start'?playStart():playEnd()}
let tt=0;function toast(m){const t=$('toast');t.textContent=m;t.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),2200)}
async function upload(k,file){
  if(!file)return;
  if(file.size>5e6){toast('5MB 이하 파일만 가능해요');return}
  try{
    const ab=await file.arrayBuffer();
    bufs[k]=await dec(ab.slice(0));
    cfg[k+'Snd']='custom';cfg[k+'Name']=file.name.replace(/\.[^.]+$/,'').slice(0,12);save();
    let kept=true;try{await idbPut(k,ab)}catch(e){kept=false}
    renderPanel();toast(kept?'적용했어요':'적용했어요 (이번 접속에만 유지돼요)');preview(k);
  }catch(e){toast('이 파일은 재생할 수 없어요')}
}

/* ---- settings panel ---- */
function renderPanel(){
  const P=$('panel'),y=P.scrollTop;
  const chips=(slot,opts)=>opts.map(([id,l])=>'<button class="chip" data-snd="'+slot+'" data-id="'+id+'" aria-pressed="'+(cfg[slot+'Snd']===id)+'">'+esc(l)+'</button>').join('');
  const up=slot=>'<label class="chip">파일 올리기<input type="file" accept="audio/*" data-file="'+slot+'"></label>';
  const so=[['a','기본'],['bell','벨']];if(bufs.start)so.push(['custom',cfg.startName||'내 파일']);
  const eo=[['bell','벨 3번'],['off','끔']];if(bufs.end)eo.push(['custom',cfg.endName||'내 파일']);
  const col=(k,l)=>'<label class="row"><span>'+l+'</span><input type="color" class="colorin" data-c="'+k+'" value="'+okc(cfg[k],DEF[k])+'"></label>';
  const sw=[['화이트','#ffffff','#000000'],['블랙','#000000','#ffffff'],['크림','#f3f1ec','#1b1b1f'],['네이비','#14213d','#ffffff']]
    .map(([n,b,f])=>'<button class="sw" data-bg="'+b+'" data-fg="'+f+'" style="background:'+b+';color:'+f+'" aria-label="'+n+'">Aa</button>').join('');
  P.innerHTML='<div class="pin"><div class="top"><button class="icon" id="pclose" aria-label="설정 닫기">'+ARROW+'</button><h1>설정</h1></div>'
   +'<h2>소리</h2><p class="hint">라운드 시작음</p><div class="chips">'+chips('start',so)+'<button class="chip" data-prev="start">▶ 듣기</button>'+up('start')+'</div>'
   +'<p class="hint">라운드 종료음</p><div class="chips">'+chips('end',eo)+'<button class="chip" data-prev="end">▶ 듣기</button>'+up('end')+'</div>'
   +'<label class="row"><span>볼륨</span><input type="range" min="0" max="100" value="'+cfg.vol+'" data-vol aria-label="볼륨"></label>'
   +'<div class="row"><span>진동</span><button class="chip" data-vib aria-pressed="'+!!cfg.vib+'">'+(cfg.vib?'켬':'끔')+'</button></div>'
   +'<h2>메인 화면 색</h2><p class="hint">조합을 고르거나 직접 지정해요</p><div class="chips">'+sw+'</div>'
   +col('mainBg','배경색')+col('mainFg','글자·테두리색')
   +'<h2>타이머 화면 배경</h2>'+col('cRound','라운드')+col('cRest','휴식')+col('cPrep','준비')+col('cWarn','종료 임박')
   +'<button class="btn reset" data-reset>소리·색 기본값으로</button></div>';
  P.scrollTop=y;
}
$('panel').addEventListener('click',e=>{
  const t=e.target.closest('button');if(!t)return;
  if(t.id==='pclose'){$('panel').classList.remove('open');stopSnd();return}
  if(t.dataset.snd){cfg[t.dataset.snd+'Snd']=t.dataset.id;save();renderPanel();preview(t.dataset.snd)}
  else if(t.dataset.prev)preview(t.dataset.prev);
  else if('vib' in t.dataset){cfg.vib=!cfg.vib;save();renderPanel()}
  else if(t.dataset.bg){cfg.mainBg=t.dataset.bg;cfg.mainFg=t.dataset.fg;save();applyColors();renderPanel()}
  else if('reset' in t.dataset){LOOK.forEach(k=>cfg[k]=DEF[k]);save();applyColors();renderPanel();toast('기본값으로 되돌렸어요')}
});
$('panel').addEventListener('input',e=>{
  const t=e.target;
  if(t.dataset.c){cfg[t.dataset.c]=t.value;save();applyColors()}
  else if('vol' in t.dataset){cfg.vol=+t.value;save();audio()}
});
$('panel').addEventListener('change',e=>{const t=e.target;if(t.dataset.file){upload(t.dataset.file,t.files[0]);t.value=''}});
$('gear').onclick=()=>{audio();renderPanel();$('panel').classList.add('open')};

/* ---- profiles ---- */
let editId=null,delId=null;
function renderProf(){
  const P=$('ppanel'),y=P.scrollTop;
  const rows=cfg.profiles.map(p=>{
    if(editId===p.id)return '<div class="row prow"><input class="tin" data-ren="'+p.id+'" maxlength="12" value="'+esc(p.name)+'" aria-label="운동 이름"><button class="chip" data-save="'+p.id+'">저장</button></div>';
    return '<div class="prof"><button class="row pick" data-pick="'+p.id+'" aria-pressed="'+(p.id===cfg.cur)+'"><span>'+esc(p.name)+'</span><small>'+fmt(p.round)+' × '+p.rounds+'R · 휴식 '+fmt(p.rest)+'</small></button>'
      +'<div class="chips"><button class="chip" data-edit="'+p.id+'">이름 변경</button><button class="chip" data-del="'+p.id+'"'+(cfg.profiles.length<2?' disabled':'')+'>'+(delId===p.id?'정말 삭제':'삭제')+'</button></div></div>';
  }).join('');
  P.innerHTML='<div class="pin"><div class="top"><button class="icon" data-close aria-label="닫기">'+ARROW+'</button><h1>운동 목록</h1></div>'+rows
    +'<h2>새 운동 추가</h2><div class="row prow"><input class="tin" id="newname" maxlength="12" placeholder="예: 줄넘기, 스쿼트" aria-label="새 운동 이름"><button class="chip" data-add>추가</button></div></div>';
  P.scrollTop=y;
}
function switchTo(id){cfg.cur=id;loadProf();save();renderSettings();updName()}
$('ppanel').addEventListener('click',e=>{
  const t=e.target.closest('button');if(!t)return;
  const d=t.dataset;
  if(!('del' in d))delId=null;
  if('close' in d){$('ppanel').classList.remove('open');return}
  if(d.pick){switchTo(d.pick);$('ppanel').classList.remove('open')}
  else if(d.edit){editId=d.edit;renderProf();const i=$('ppanel').querySelector('[data-ren]');if(i){i.focus();i.select()}}
  else if(d.save)saveName(d.save);
  else if(d.del){
    if(delId===d.del){
      cfg.profiles=cfg.profiles.filter(p=>p.id!==d.del);delId=null;
      if(!cfg.profiles.some(p=>p.id===cfg.cur))cfg.cur=cfg.profiles[0].id;
      loadProf();save();renderSettings();updName();renderProf();
    }else{delId=d.del;renderProf()}
  }
  else if('add' in d)addProf();
});
function saveName(id){
  const i=$('ppanel').querySelector('[data-ren="'+id+'"]'),n=i?i.value.trim():'';
  if(!n){toast('이름을 입력해주세요');return}
  cfg.profiles.find(p=>p.id===id).name=n.slice(0,12);editId=null;save();updName();renderProf();
}
function addProf(){
  const n=($('newname').value.trim()||'운동 '+(cfg.profiles.length+1)).slice(0,12);
  const p=Object.assign({id:'p'+Date.now(),name:n},TDEF);
  cfg.profiles.push(p);switchTo(p.id);$('ppanel').classList.remove('open');toast('"'+n+'" 추가했어요');
}
$('ppanel').addEventListener('keydown',e=>{
  if(e.key!=='Enter')return;
  if(e.target.dataset.ren)saveName(e.target.dataset.ren);else if(e.target.id==='newname')addProf();
});
$('pname').onclick=()=>{editId=null;delId=null;renderProf();$('ppanel').classList.add('open')};

/* ---- timer ---- */
let seq=[],idx=0,phaseEnd=0,remainMs=0,paused=false,raf=0,lastSec=-1,warned=false,wake=null;
function build(){
  seq=[];
  if(cfg.prep>0)seq.push({t:'prep',d:cfg.prep,r:0});
  for(let i=1;i<=cfg.rounds;i++){
    seq.push({t:'round',d:cfg.round,r:i});
    if(i<cfg.rounds)seq.push({t:'rest',d:cfg.rest,r:i});
  }
}
async function lock(){try{if(navigator.wakeLock)wake=await navigator.wakeLock.request('screen')}catch(e){}}
function unlock(){try{wake&&wake.release()}catch(e){}wake=null}
function begin(){
  audio();loadPresets();build();idx=0;paused=false;
  $('app').classList.add('running');
  lock();enter();
  cancelAnimationFrame(raf);raf=requestAnimationFrame(loop);
}
function enter(){
  const p=seq[idx];
  remainMs=p.d*1000;phaseEnd=performance.now()+remainMs;lastSec=-1;warned=false;
  setBody(p.t);
  $('phase').textContent=p.t==='prep'?'준비':p.t==='round'?'ROUND '+p.r:'휴식';
  $('count').textContent=p.t==='prep'?'곧 시작해요':p.t==='round'?p.r+' / '+cfg.rounds+' 라운드':'다음: ROUND '+(p.r+1);
  if(p.t==='round'){playStart();vib([200])}
  updNav();updLeft(p.d);
}
const ARROW='<svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>';
function canPrev(){return idx>0&&seq[idx-1].t!=='prep'}
function canNext(){return idx<seq.length-1}
function updNav(){$('prev').disabled=!canPrev();$('next').disabled=!canNext()}
function goIdx(i){
  idx=i;stopSnd();enter();paused=false;$('pause').textContent='일시정지';
  cancelAnimationFrame(raf);raf=requestAnimationFrame(loop);
}
$('prev').onclick=()=>{if(canPrev())goIdx(idx-1)};
$('next').onclick=()=>{if(canNext())goIdx(idx+1)};
function updLeft(sec){let t=sec;for(let i=idx+1;i<seq.length;i++)t+=seq[i].d;$('left').textContent='전체 남은 시간 '+fmt(t)}
function setBody(c){document.body.className=c+' running'}
function loop(now){
  if(paused)return;
  const p=seq[idx];
  remainMs=phaseEnd-now;
  const sec=Math.max(0,Math.ceil(remainMs/1000));
  if(sec!==lastSec){
    lastSec=sec;$('time').textContent=fmt(sec);updLeft(sec);
    if(p.t==='round'&&cfg.warn&&sec===cfg.warn&&!warned){warned=true;clap();vib([100,80,100]);setBody('warn')}
    if((p.t==='rest'||p.t==='prep')&&sec<=3&&sec>0)tick();
  }
  $('fill').style.width=Math.min(100,(1-remainMs/(p.d*1000))*100)+'%';
  if(remainMs<=0){
    if(p.t==='round'){playEnd();vib([400,150,400])}
    idx++;
    if(idx>=seq.length){finish();return}
    enter();
  }
  raf=requestAnimationFrame(loop);
}
function finish(){
  document.body.className='done running';
  $('phase').textContent='끝!';$('left').textContent='';$('time').textContent='수고했어요';$('count').textContent=cfg.rounds+'라운드 완료';
  $('fill').style.width='100%';$('pause').style.display='none';
  $('stop').textContent='처음으로';document.querySelector('.nav').style.display='none';unlock();vib([300,100,300,100,300]);
}
function stop(){
  cancelAnimationFrame(raf);unlock();stopSnd();
  document.body.className='';
  $('app').classList.remove('running');
  $('pause').style.display='';$('pause').textContent='일시정지';$('stop').textContent='종료';document.querySelector('.nav').style.display='';
}
$('start').onclick=begin;
$('stop').onclick=stop;
$('pause').onclick=()=>{
  if(!paused){paused=true;remainMs=phaseEnd-performance.now();$('pause').textContent='계속'}
  else{paused=false;phaseEnd=performance.now()+remainMs;$('pause').textContent='일시정지';raf=requestAnimationFrame(loop)}
};
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&wake===null&&$('app').classList.contains('running')&&!paused)lock()});
applyColors();updName();renderSettings();
audio();loadPresets();loadCustom();
</script>
